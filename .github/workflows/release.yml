name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -coverpkg=./... ./...

      - name: Build windows binary
        run: |
          go build -trimpath \
            -ldflags "-H=windowsgui -s -w -X main.version=${GITHUB_REF_NAME}" \
            -o eew-hddguard.exe ./cmd/eew-hddguard
        env:
          GOOS: windows
          GOARCH: amd64

      - name: Package
        run: zip "eew-hddguard-${GITHUB_REF_NAME}-windows-amd64.zip" eew-hddguard.exe config.example.json README.md LICENSE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "eew-hddguard-${GITHUB_REF_NAME}-windows-amd64.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
